services:
  - type: web
    name: cbm-trading
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_TOKEN
        sync: false
      - key: DERIV_ACCOUNT_ID
        sync: false
      - key: DERIV_DEMO_TOKEN
        sync: false
      - key: DERIV_DEMO_ACCOUNT_ID
        sync: false
      - key: DERIV_REAL_TOKEN
        sync: false
      - key: DERIV_REAL_ACCOUNT_ID
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cbm-trading-db
          property: connectionString
databases:
  - name: cbm-trading-db
    plan: free
